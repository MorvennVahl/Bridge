[project]
name = "bridge"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "modal>=1.5.5",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
]

[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "pyright>=1.1.380",
]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [".agents", "data"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "C4",  # comprehensions
    "PIE", # misc quality
    "RUF", # ruff-specific
]
ignore = [
    "E501",  # line too long (formatter handles)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
include = ["main.py", "src"]
exclude = [".venv", ".agents", "data", "**/__pycache__"]
pythonVersion = "3.13"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
reportMissingImports = "warning"
