[project]
name = "bridge"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "modal>=1.5.5",
    "polars>=1.44.2",
]

[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "pyright>=1.1.380",
]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [".agents", "data"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "C4",  # comprehensions
    "PIE", # misc quality
    "RUF", # ruff-specific
]
ignore = [
    "E501",  # line too long (formatter handles)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
include = ["main.py", "bridge", "scripts"]
# Pre-existing type errors, tracked separately rather than fixed in passing: 18 in
# condition_map.py, 18 in the fetch scripts, 5 in build_features.py. Several are real
# None-subscript crashes on API responses. Until then these paths stay unchecked, but
# everything else under bridge/ is now covered — previously `include` pointed at a src/
# directory that does not exist, so no module in the repo was type-checked at all.
ignore = ["bridge/condition_map.py", "scripts"]
exclude = [".venv", ".agents", "data", "**/__pycache__"]
pythonVersion = "3.13"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
reportMissingImports = "warning"
