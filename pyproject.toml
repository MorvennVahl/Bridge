[project]
name = "bridge"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "modal>=1.5.5",
    "numpy>=2.2.0",
    "pandas>=2.2.0",
    "polars>=1.44.2",
    "pyarrow>=17.0.0",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "pyright>=1.1.380",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [".agents", "data", "frontend"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "C4",  # comprehensions
    "PIE", # misc quality
    "RUF", # ruff-specific
]
ignore = [
    "E501",  # line too long (formatter handles)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
include = ["main.py", "bridge", "backend", "modal_app.py"]
exclude = [".venv", ".agents", "data", "frontend", "scripts", "**/__pycache__"]
pythonVersion = "3.13"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
reportMissingImports = "warning"
# Pandas stubs generate false positives on itertuples() and to_dict() overloads.
reportAttributeAccessIssue = "warning"
reportCallIssue = "warning"
